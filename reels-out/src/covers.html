<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap">
<link rel="stylesheet" href="common.css"><script src="icons.js"></script><script src="common.js"></script>
<style>
.cv{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:0 90px}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.logo{position:absolute;left:90px;top:300px;display:flex;align-items:center;gap:18px}
.logo .m{width:72px;height:72px;display:block}
.logo b{font:600 44px/1 var(--display);letter-spacing:-.025em}
.logo b span{color:var(--r600)}
.logo em{font:700 18px/1 var(--sans);font-style:normal;letter-spacing:.18em;color:var(--g600);margin-left:10px}
.big{font:600 124px/1.02 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.bub{padding:32px 38px;border-radius:38px;font:400 40px/1.38 var(--sans)}
.out{background:var(--r600);color:#fff;border-bottom-right-radius:10px;align-self:flex-end;max-width:760px;box-shadow:0 18px 40px -12px rgba(133,74,83,.45)}
.in{background:#fff;border:2px solid var(--n200);border-bottom-left-radius:10px;align-self:flex-start}
.tile{width:240px;height:240px;border-radius:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:600 30px/1.1 var(--sans);text-align:center}
</style></head><body><div id="stage">

<!-- Capa 1 -->
<div class="cv" id="c1">
  <div class="glow" style="width:1000px;height:1000px;right:-380px;top:120px;background:radial-gradient(circle,rgba(237,207,211,.75),rgba(237,207,211,0) 65%)"></div>
  <div class="logo"></div>
  <div style="position:relative;margin-top:60px">
    <div style="font:600 260px/1 var(--display);letter-spacing:-.03em;color:var(--r600);font-variant-numeric:tabular-nums">22:07</div>
    <p class="big" style="margin-top:30px">A IA agendou enquanto você <span class="grad">descansava.</span></p>
    <div style="display:flex;flex-direction:column;gap:22px;margin-top:70px">
      <div class="bub in">Queria fazer clareamento, como funciona?</div>
      <div class="bub out">Pronto! Sua avaliação está marcada para quinta, 14:30.</div>
    </div>
  </div>
</div>

<!-- Capa 2 -->
<div class="cv" id="c2">
  <div class="glow" style="width:1000px;height:1000px;left:-420px;top:700px;background:radial-gradient(circle,rgba(241,205,187,.7),rgba(241,205,187,0) 65%)"></div>
  <div class="logo"></div>
  <div style="position:relative;margin-top:40px">
    <div style="border:5px dashed rgba(217,139,106,.6);border-radius:44px;padding:44px 50px;display:flex;align-items:center;gap:40px;background:rgba(252,244,240,.8)">
      <div style="font:600 76px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--t700)">14:00</div>
      <div style="font:500 44px/1.25 var(--sans);color:var(--t700)">Horário vago<br><span style="font-weight:400;font-size:34px;color:var(--n500)">Paciente faltou</span></div>
    </div>
    <p class="big" style="margin-top:80px;font-size:150px">Cadeira vazia <span class="grad">custa caro.</span></p>
    <div class="card" style="margin-top:80px;padding:36px 42px;display:flex;align-items:center;gap:28px">
      <span class="ico" style="width:84px;height:84px;border-radius:24px;background:var(--s50);color:var(--s700);padding:20px">${''}</span>
      <div style="flex:1;font:500 40px/1.3 var(--sans)">Lembrete automático no WhatsApp</div>
      <span class="badge b-conf"><i></i>Confirmado</span>
    </div>
  </div>
</div>

<!-- Capa 3 -->
<div class="cv" id="c3">
  <div class="glow" style="width:1100px;height:1100px;right:-300px;top:820px;background:radial-gradient(circle,rgba(235,218,182,.65),rgba(235,218,182,0) 65%)"></div>
  <div class="logo"></div>
  <div style="position:relative;margin-top:40px">
    <p class="big" style="font-size:136px">Sua clínica inteira em <span class="grad">um só lugar.</span></p>
    <div id="grid" style="margin-top:90px;display:grid;grid-template-columns:repeat(3,240px);justify-content:space-between;row-gap:44px"></div>
  </div>
</div>

</div>
<script>
const LOGO = `<span class="m">${MARK}</span><b>Clin<span>IQ</span><em>PRO</em></b>`;
$$('.logo').forEach((el, i) => el.innerHTML = LOGO.replace(/"tl"/g, `"tl${i}"`).replace(/#tl\)/g, `#tl${i})`).replace(/"sh"/g, `"sh${i}"`).replace(/#sh\)/g, `#sh${i})`));
$('#c2 .ico').innerHTML = ICONS['bell-ring'];
const T = [['calendar-days', 'Agenda', 'var(--r600)', '#fff'], ['smile', 'Odontograma', 'var(--r100)', 'var(--r800)'], ['scan-face', 'Harmonização', 'var(--g500)', 'var(--ink)'],
  ['camera', 'Antes e depois', 'var(--sand)', 'var(--ink)'], ['wallet', 'Financeiro', 'var(--ink)', '#fff'], ['package', 'Estoque', 'var(--s500)', 'var(--ink)']];
$('#grid').innerHTML = T.map(([i, l, bg, fg]) => `<div class="tile" style="background:${bg};color:${fg}">${icon(i, 72)}<span>${l}</span></div>`).join('');
window.DURATION = 1;
window.render = n => { $$('.cv').forEach(c => c.style.display = 'none'); $('#c' + n).style.display = 'flex'; };
</script></body></html>
