name: CI — Homologação

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations & testes de integração
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/clinic_test
    steps:
      - name: Checkout (com histórico, para comparar com a base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Type check backend
        run: npx tsc --noEmit -p packages/backend

      # Recria o schema da produção (commit base), aplica só as migrations
      # novas e falha se o resultado divergir do schema.prisma.
      - name: Validar migrations contra o schema da produção
        run: sh scripts/ci-prepare-test-db.sh "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"

      - name: Testes de integração
        run: npm run test:integration -w packages/backend

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Build backend (TypeScript)
        run: npm run build -w packages/backend

      - name: Build frontend (Vite)
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: http://staging.cliniq.local/api
