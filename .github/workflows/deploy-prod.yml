name: Deploy — Produção

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy" para confirmar o envio para produção'
        required: true
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Build backend (TypeScript)
        run: npm run build -w packages/backend

      - name: Build frontend (Vite)
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: http://${{ secrets.VPS_HOST }}/api

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_URL=http://${{ secrets.VPS_HOST }}/api
            VITE_APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: SSH — pull da imagem e restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}

            echo "==> Sincronizando docker-compose.yml/nginx.conf (sem build de código)..."
            git pull origin main

            export RELEASE_SHA="${GITHUB_SHA}"

            echo "==> Baixando imagens já publicadas no ghcr.io..."
            docker compose pull

            echo "==> Restarting services..."
            docker compose up -d --remove-orphans

            echo "==> Aguardando backend inicializar (10s)..."
            sleep 10

            echo "==> Health check..."
            curl -sf http://localhost/api/health || (echo "HEALTH CHECK FAILED" && docker compose logs backend --tail=50 && exit 1)

            echo "==> Deploy concluido com sucesso!"
            docker compose ps
        env:
          GITHUB_SHA: ${{ github.sha }}
