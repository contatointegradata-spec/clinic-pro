name: Deploy — Produção

on:
  push:
    branches: [main]
  # Mantido como fallback manual (ex.: re-rodar um deploy sem precisar de um
  # novo commit).
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  test:
    name: Migrations & testes de integração
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/clinic_test
    steps:
      - name: Checkout (com histórico, para comparar com a base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Type check backend
        run: npx tsc --noEmit -p packages/backend

      # Recria o schema da produção (commit base), aplica só as migrations
      # novas e falha se o resultado divergir do schema.prisma.
      - name: Validar migrations contra o schema da produção
        run: sh scripts/ci-prepare-test-db.sh "${{ github.event.before || 'HEAD~1' }}"

      - name: Testes de integração
        run: npm run test:integration -w packages/backend

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # Nada vai para a VPS se migrations ou testes falharem.
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Build backend (TypeScript)
        run: npm run build -w packages/backend

      - name: Build frontend (Vite)
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: /api

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: SSH — pull da imagem e restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_SHA,GROQ_API_KEY
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}

            echo "==> Sincronizando docker-compose.yml/nginx.conf (sem build de código)..."
            git fetch origin main
            git reset --hard origin/main

            export RELEASE_SHA="${GITHUB_SHA}"

            echo "==> Sincronizando GROQ_API_KEY no .env do servidor..."
            touch .env
            grep -v '^GROQ_API_KEY=' .env > .env.tmp || true
            echo "GROQ_API_KEY=${GROQ_API_KEY}" >> .env.tmp
            mv .env.tmp .env

            echo "==> Baixando imagens já publicadas no ghcr.io..."
            docker compose pull

            # Também atualiza o ":latest" local. Sem isso, um
            # `docker compose up -d` manual na VPS (sem RELEASE_SHA) recriava o
            # container com um ":latest" antigo e voltava o sistema de versão.
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            echo "==> Restarting services..."
            docker compose up -d --remove-orphans

            echo "==> Aguardando backend inicializar (10s)..."
            sleep 10

            echo "==> Health check..."
            curl -sf http://localhost/api/health || (echo "HEALTH CHECK FAILED" && docker compose logs backend --tail=50 && exit 1)

            echo "==> Deploy concluido com sucesso!"
            docker compose ps
        env:
          GITHUB_SHA: ${{ github.sha }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
