events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =====================================================
    # MAPA DE SUBDOMINIOS (todos apontam para 2.25.185.223)
    # =====================================================
    # O nginx escolhe o projeto pelo nome digitado (server_name):
    #   cliniqpro.integradata.app.br  -> Clinic Pro (frontend/backend)
    #   gestaodev.integradata.app.br  -> Gestao de Desenvolvimento (gestao-dev-integradata)
    #   n8n.integradata.app.br        -> redireciona para o n8n (HTTPS sslip.io)
    #   evolution.integradata.app.br  -> redireciona para a Evolution API (HTTPS sslip.io)
    #   gestfiscal / hub              -> ainda sem container: caem no bloco padrao abaixo
    # Subdominio sem bloco proprio NAO abre mais o Clinic Pro: recebe 404.

    # =====================================================
    # PADRAO - dominio nao configurado
    # =====================================================
    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            default_type text/plain;
            return 404 "Dominio nao configurado neste servidor.\n";
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/integradata-automation/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/integradata-automation/privkey.pem;

        # Fecha a conexao: evita que um HTTPS de outro subdominio caia no n8n.
        return 444;
    }

    # =====================================================
    # N8N / EVOLUTION - subdominios integradata.app.br
    # =====================================================
    # O certificado HTTPS atual cobre so os nomes sslip.io; por isso estes
    # subdominios apenas redirecionam para eles.
    server {
        listen 80;
        server_name n8n.integradata.app.br;
        return 301 https://n8n.2-25-185-223.sslip.io$request_uri;
    }

    server {
        listen 80;
        server_name evolution.integradata.app.br;
        return 301 https://evolution.2-25-185-223.sslip.io$request_uri;
    }

    # =====================================================
    # N8N - HTTP
    # =====================================================
    server {
        listen 80;
        server_name n8n.2-25-185-223.sslip.io;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================
    # N8N - HTTPS
    # =====================================================
    server {
        listen 443 ssl;
        server_name n8n.2-25-185-223.sslip.io;

        ssl_certificate /etc/letsencrypt/live/integradata-automation/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/integradata-automation/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 50M;

        location / {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }
    }


    # =====================================================
    # EVOLUTION - HTTP
    # =====================================================
    server {
        listen 80;
        server_name evolution.2-25-185-223.sslip.io;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================
    # EVOLUTION - HTTPS
    # =====================================================
    server {
        listen 443 ssl;
        server_name evolution.2-25-185-223.sslip.io;

        ssl_certificate /etc/letsencrypt/live/integradata-automation/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/integradata-automation/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 50M;

        location / {
            set $evolution_upstream http://evolution:8080;
            proxy_pass $evolution_upstream;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
    }


    # =====================================================
    # CLINIC PRO
    # =====================================================
    server {
        listen 80;
        # localhost/127.0.0.1: health checks do deploy (curl http://localhost/api/...).
        server_name cliniqpro.integradata.app.br 2.25.185.223 localhost 127.0.0.1;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        client_max_body_size 10M;

        location /api/ {
            set $backend_upstream http://backend:3001;
            proxy_pass $backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


    # =====================================================
    # GESTAO DE DESENVOLVIMENTO - INTEGRADATA
    # =====================================================
    # Container do repo portal-gestao-de-desenvolvimento, alcancado pela rede
    # compartilhada integradata_proxy (resolvido no momento da requisicao).
    server {
        listen 80;
        server_name gestaodev.integradata.app.br;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # Arquivos de entrada dos RPAs (RPA_MAX_FILE_MB=25) + importacao de colecoes.
        client_max_body_size 30M;

        # Transmissao ao vivo do navegador do robo (noVNC). No .env da aplicacao:
        #   RPA_LIVE_VIEW_URL=http://gestaodev.integradata.app.br/live-view
        location /live-view/ {
            set $gestao_live http://gestao-dev-integradata:6080;
            rewrite ^/live-view/(.*)$ /$1 break;
            proxy_pass $gestao_live;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }

        location / {
            set $gestao_app http://gestao-dev-integradata:5174;
            proxy_pass $gestao_app;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Logs das execucoes chegam em tempo real (streaming): sem buffer e sem corte.
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }
    }
}
